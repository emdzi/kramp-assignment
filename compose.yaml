services:
  mock-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: mock-server
        APP_PORT: 8081
    ports:
      - "${MOCK_SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  aggregator-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: aggregator-service
        APP_PORT: 8080
    environment:
      APP_UPSTREAM_BASE_URL: http://mock-server:8081/api/v1/upstream
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${AGGREGATOR_PORT:-8080}:8080"
    depends_on:
      mock-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
